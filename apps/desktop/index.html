<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoxyTunnel</title>
  </head>
  <body>
    <main class="shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">FoxyTunnel</p>
            <h1>Tor Control</h1>
          </div>
        </div>
        <div class="header-actions">
          <span id="status-pill" class="status-pill">Loading</span>
          <button id="close-button" class="icon-button" type="button" aria-label="Close">X</button>
        </div>
      </header>

      <section class="connection-panel">
        <div class="connection-head">
          <div>
            <span class="label">Endpoint</span>
            <strong id="endpoint-text">127.0.0.1:19050</strong>
          </div>
          <button id="copy-endpoint-button" type="button" class="mini-button">Copy</button>
        </div>
        <div class="connection-actions">
          <button id="test-tor-button" type="button" class="ghost">Test Tor</button>
          <span id="tor-test-text" class="connection-note">Not tested</span>
        </div>
      </section>

      <button id="action-button" class="action-button" type="button">Start SOCKS</button>

      <section class="settings-panel">
        <label class="field">
          <span>Port</span>
          <input id="port-input" type="number" min="1" max="65535" value="19050" />
        </label>
        <label class="field">
          <span>Bootstrap</span>
          <input id="timeout-input" type="number" min="10" max="600" value="120" />
        </label>
        <label class="check-row">
          <input id="log-input" type="checkbox" />
          <span>Log connections</span>
        </label>
      </section>

      <section class="activity-panel">
        <div class="activity-header">
          <span class="label">Live log</span>
          <div class="log-actions">
            <button id="refresh-button" type="button" class="ghost">Refresh</button>
            <button id="clear-log-button" type="button" class="ghost">Clear</button>
          </div>
        </div>
        <pre id="message-log">Ready.</pre>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
