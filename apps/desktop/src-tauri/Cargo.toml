[package]
name = "foxytunnel-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
foxytunnel-core = { path = "../../../crates/foxytunnel-core" }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1.52.3", default-features = false, features = ["sync", "time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
