[package]
name = "foxytunnel-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
foxytunnel-core = { path = "../../../crates/foxytunnel-core" }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "native-tls", "socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-notification = "2.3.3"
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
